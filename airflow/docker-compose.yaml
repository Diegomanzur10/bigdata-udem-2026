# Airflow 3.3.2 en una sola VM (EC2): LocalExecutor + Postgres 16.
# Imagen base fijada por documentación oficial de Airflow 3.3.2 (apache/airflow:3.3.2).
# Variables sensibles en .env (plantilla: .env.example). La VM genera el .env en user-data.
# Servicios: postgres, init (db migrate), api-server (UI en 8080), scheduler, dag-processor, triggerer.
# Límites de memoria pensados para una instancia de 8 GB (m7i-flex.large); ajustables con MEM_*.

x-airflow-common: &airflow-common
  # Imagen extendida mínima: providers amazon y snowflake sobre apache/airflow:3.3.2.
  # Dockerfile inline (sin archivo extra). La versión va fija en el texto: si se sube Airflow,
  # cambiar FROM, la URL de constraints y el nombre de "image".
  # Constraints oficiales de Airflow 3.3.2 según la versión de Python de la imagen base.
  build:
    dockerfile_inline: |
      FROM apache/airflow:3.3.2
      RUN python -c 'import sys; print("https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-%d.%d.txt" % sys.version_info[:2])' > /tmp/constraints.url \
       && pip install --no-cache-dir --constraint "$(cat /tmp/constraints.url)" \
          apache-airflow-providers-amazon \
          apache-airflow-providers-snowflake \
       && rm -f /tmp/constraints.url
  image: bigdata/airflow-extended:3.3.2
  user: "${AIRFLOW_UID:-50000}:0"
  restart: unless-stopped
  # Conexion snowflake_default (AIRFLOW_CONN_SNOWFLAKE_DEFAULT). La genera /usr/local/bin/airflow-refresh.sh
  # en la VM a partir del secreto <prefix>/snowflake; en local es opcional.
  env_file:
    - path: ./snowflake.env
      required: false
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?definir AIRFLOW_FERNET_KEY en .env}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?definir AIRFLOW_JWT_SECRET en .env}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://api-server:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # SimpleAuthManager (no apto para producción). Usuario admin; la contraseña viene del archivo
    # generado por user-data a partir de Secrets Manager (${prefix}/airflow-admin).
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/secrets/simple_auth_manager_passwords.json
    # Conexión aws_default: sin claves, usa el rol de instancia (IMDSv2 con hop limit 2 para contenedores).
    AIRFLOW_CONN_AWS_DEFAULT: '{"conn_type": "aws", "extra": {"region_name": "${AWS_REGION:-us-east-2}"}}'
    AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-2}
    # Variable de Airflow `prefix` (los DAGs arman los nombres de jobs Glue ${prefix}-<perfil>).
    AIRFLOW_VAR_PREFIX: ${AIRFLOW_PREFIX:-bigdata}
    # Permite importar el paquete framework/ (tasks.py, profiles.yaml) desde los DAGs.
    PYTHONPATH: /opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./framework:/opt/airflow/framework
    - ./secrets:/opt/airflow/secrets

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env}
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    mem_limit: ${MEM_POSTGRES:-512m}

  init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: ${MEM_INIT:-1g}

  api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    mem_limit: ${MEM_API_SERVER:-1g}

  scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      api-server:
        condition: service_healthy
    mem_limit: ${MEM_SCHEDULER:-1536m}

  dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      postgres:
        condition: service_healthy
      api-server:
        condition: service_healthy
    mem_limit: ${MEM_DAG_PROCESSOR:-768m}

  triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      postgres:
        condition: service_healthy
      api-server:
        condition: service_healthy
    mem_limit: ${MEM_TRIGGERER:-512m}

volumes:
  postgres-db-volume:
