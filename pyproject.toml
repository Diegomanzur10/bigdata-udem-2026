[project]
name = "bigdata-udem-pipeline"
version = "0.1.0"
description = "Pipeline PySpark bronze/silver/gold con NYC TLC yellow trips, taxi zones y clima Open-Meteo"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
