name: Permitir IP

on:
  workflow_dispatch:
    inputs:
      ip:
        description: "IPv4 pública del alumno (p. ej. 203.0.113.10 o 203.0.113.10/32)"
        required: true
        type: string
      etiqueta:
        description: "Etiqueta corta para identificar la regla (letras, números, espacios, . _ -)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: airflow-sg
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  PREFIX: ${{ vars.PREFIX || 'bigdata' }}
  # Máximo de reglas IPv4 en el puerto 8080; al superarlo se quita la más antigua.
  MAX_REGLAS: "3"
  IP_INPUT: ${{ inputs.ip }}
  ETIQUETA_INPUT: ${{ inputs.etiqueta }}

jobs:
  permitir:
    name: Agregar IP al security group de Airflow
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validar entrada
        run: |
          set -euo pipefail

          ip="$IP_INPUT"
          if [[ "$ip" == */* ]]; then
            if [[ "$ip" != */32 ]]; then
              echo "::error::Solo se admite una IP sola o con /32."
              exit 1
            fi
            ip="${ip%/32}"
          fi

          # shellcheck disable=SC2016  # la regex se usa literal, sin expansión
          re='^(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$'
          if ! [[ "$ip" =~ $re ]]; then
            echo "::error::IPv4 mal formada: $IP_INPUT"
            exit 1
          fi
          o1="${BASH_REMATCH[1]}"; o2="${BASH_REMATCH[2]}"; o3="${BASH_REMATCH[3]}"; o4="${BASH_REMATCH[4]}"
          for o in "$o1" "$o2" "$o3" "$o4"; do
            if (( o > 255 )); then
              echo "::error::Octeto fuera de rango en $ip"
              exit 1
            fi
          done

          rechazo=""
          if (( o1 == 0 )); then rechazo="0.0.0.0/8 (no enrutable / esta red)"
          elif (( o1 == 10 )); then rechazo="10.0.0.0/8 (privada)"
          elif (( o1 == 127 )); then rechazo="127.0.0.0/8 (loopback)"
          elif (( o1 == 169 && o2 == 254 )); then rechazo="169.254.0.0/16 (link-local)"
          elif (( o1 == 172 && o2 >= 16 && o2 <= 31 )); then rechazo="172.16.0.0/12 (privada)"
          elif (( o1 == 192 && o2 == 168 )); then rechazo="192.168.0.0/16 (privada)"
          elif (( o1 == 100 && o2 >= 64 && o2 <= 127 )); then rechazo="100.64.0.0/10 (CGNAT)"
          elif (( o1 == 192 && o2 == 0 && o3 == 0 )); then rechazo="192.0.0.0/24 (reservada)"
          elif (( o1 == 192 && o2 == 0 && o3 == 2 )); then rechazo="192.0.2.0/24 (documentación)"
          elif (( o1 == 198 && (o2 == 18 || o2 == 19) )); then rechazo="198.18.0.0/15 (benchmark)"
          elif (( o1 == 198 && o2 == 51 && o3 == 100 )); then rechazo="198.51.100.0/24 (documentación)"
          elif (( o1 == 203 && o2 == 0 && o3 == 113 )); then rechazo="203.0.113.0/24 (documentación)"
          elif (( o1 >= 224 )); then rechazo="224.0.0.0/3 (multicast/reservada/broadcast)"
          fi
          if [[ -n "$rechazo" ]]; then
            echo "::error::IP rechazada: $ip pertenece a $rechazo. Usa tu IP pública."
            exit 1
          fi

          if ! [[ "$ETIQUETA_INPUT" =~ ^[A-Za-z0-9][A-Za-z0-9\ ._-]{0,39}$ ]]; then
            echo "::error::Etiqueta inválida (1-40 caracteres: letras, números, espacio, . _ -)."
            exit 1
          fi

          echo "IP_CIDR=${ip}/32" >> "$GITHUB_ENV"
          echo "IP válida: ${ip}/32"

      - name: Reemplazar regla en el security group
        run: |
          set -euo pipefail

          SG_ID="$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=${PREFIX}-airflow-sg" \
            --query 'SecurityGroups[0].GroupId' --output text)"
          if [[ -z "$SG_ID" || "$SG_ID" == "None" ]]; then
            echo "::error::No existe el security group ${PREFIX}-airflow-sg."
            exit 1
          fi

          FECHA="$(date -u +%Y-%m-%dT%H:%MZ)"
          # ';' separa etiqueta y fecha: AWS no admite '|' en descripciones de reglas.
          DESC="${ETIQUETA_INPUT};${FECHA}"

          # Lista actual de reglas IPv4 en tcp/8080: líneas "cidr<TAB>descripción".
          ACTUALES="$(aws ec2 describe-security-groups --group-ids "$SG_ID" \
              --query "SecurityGroups[0].IpPermissions[?IpProtocol==\`tcp\` && FromPort==\`8080\` && ToPort==\`8080\`].IpRanges[].[CidrIp,Description]" \
            --output text)"

          # Si la misma IP ya tiene regla, se revoca para recrearla con la nueva descripción.
          LISTA=""
          while IFS=$'\t' read -r cidr desc; do
            [[ -z "${cidr:-}" ]] && continue
            [[ "$desc" == "None" ]] && desc=""
            if [[ "$cidr" == "$IP_CIDR" ]]; then
              aws ec2 revoke-security-group-ingress --group-id "$SG_ID" \
                --protocol tcp --port 8080 --cidr "$cidr" >/dev/null
              echo "Regla previa de ${cidr} revocada (se recrea)."
              continue
            fi
            # Clave de orden: la fecha (tras ';'); sin fecha = más antigua.
            clave=""
            if [[ "$desc" == *";"* ]]; then clave="${desc#*;}"; fi
            LISTA="${LISTA}${clave}"$'\t'"${cidr}"$'\n'
          done <<< "$ACTUALES"

          # Ordenar de más antigua a más nueva y dejar hueco para la nueva regla.
          ORDENADA="$(printf '%s' "$LISTA" | sort)"
          while [[ -n "$ORDENADA" ]] && (( $(printf '%s\n' "$ORDENADA" | grep -c .) >= MAX_REGLAS )); do
            vieja="$(printf '%s\n' "$ORDENADA" | head -1)"
            cidr_viejo="$(cut -f2 <<< "$vieja")"
            aws ec2 revoke-security-group-ingress --group-id "$SG_ID" \
              --protocol tcp --port 8080 --cidr "$cidr_viejo" >/dev/null
            echo "Regla antigua ${cidr_viejo} eliminada (límite ${MAX_REGLAS})."
            ORDENADA="$(printf '%s\n' "$ORDENADA" | tail -n +2)"
          done

          PERMISO="$(jq -nc --arg c "$IP_CIDR" --arg d "$DESC" \
            '[{IpProtocol:"tcp",FromPort:8080,ToPort:8080,IpRanges:[{CidrIp:$c,Description:$d}]}]')"
          aws ec2 authorize-security-group-ingress --group-id "$SG_ID" --ip-permissions "$PERMISO" >/dev/null

          echo "Regla agregada: ${IP_CIDR} tcp/8080 descripción '${DESC}'."
          echo "Reglas actuales en 8080:"
          aws ec2 describe-security-groups --group-ids "$SG_ID" \
              --query "SecurityGroups[0].IpPermissions[?IpProtocol==\`tcp\` && FromPort==\`8080\`].IpRanges[].[CidrIp,Description]" \
            --output table
