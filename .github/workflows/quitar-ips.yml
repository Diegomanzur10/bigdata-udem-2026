name: Quitar IPs

on:
  workflow_dispatch:
    inputs:
      ip:
        description: "IPv4 a quitar del puerto 8080 (opcional si marcas 'todas')"
        required: false
        type: string
        default: ""
      todas:
        description: "Quitar todas las reglas IPv4 del puerto 8080"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: airflow-sg
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  PREFIX: ${{ vars.PREFIX || 'bigdata' }}
  IP_INPUT: ${{ inputs.ip }}
  TODAS_INPUT: ${{ inputs.todas }}

jobs:
  quitar:
    name: Quitar reglas del security group de Airflow
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Quitar reglas
        run: |
          set -euo pipefail

          if [[ "$TODAS_INPUT" != "true" && -z "$IP_INPUT" ]]; then
            echo "::error::Indica una IP o marca 'todas'."
            exit 1
          fi
          if [[ -n "$IP_INPUT" ]]; then
            # shellcheck disable=SC2016  # la regex se usa literal, sin expansión
            re='^(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$'
            ip="${IP_INPUT%/32}"
            if ! [[ "$ip" =~ $re ]]; then
              echo "::error::IPv4 mal formada: $IP_INPUT"
              exit 1
            fi
          fi

          SG_ID="$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=${PREFIX}-airflow-sg" \
            --query 'SecurityGroups[0].GroupId' --output text)"
          if [[ -z "$SG_ID" || "$SG_ID" == "None" ]]; then
            echo "::error::No existe el security group ${PREFIX}-airflow-sg."
            exit 1
          fi

          if [[ "$TODAS_INPUT" == "true" ]]; then
            CIDRS="$(aws ec2 describe-security-groups --group-ids "$SG_ID" \
              --query "SecurityGroups[0].IpPermissions[?IpProtocol==\`tcp\` && FromPort==\`8080\` && ToPort==\`8080\`].IpRanges[].CidrIp" \
              --output text)"
          else
            CIDRS="${ip}/32"
          fi

          for cidr in $CIDRS; do
            [[ "$cidr" == "None" ]] && continue
            aws ec2 revoke-security-group-ingress --group-id "$SG_ID" \
              --protocol tcp --port 8080 --cidr "$cidr" >/dev/null || echo "::warning::No se pudo revocar ${cidr} (¿ya no existe?)"
            echo "Revocada ${cidr} en tcp/8080."
          done

          echo "Reglas restantes en 8080:"
          aws ec2 describe-security-groups --group-ids "$SG_ID" \
              --query "SecurityGroups[0].IpPermissions[?IpProtocol==\`tcp\` && FromPort==\`8080\`].IpRanges[].[CidrIp,Description]" \
            --output table
