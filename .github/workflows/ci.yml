name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-2
  TERRAFORM_VERSION: "1.17.0"
  PREFIX: ${{ vars.PREFIX || 'bigdata' }}

jobs:
  lint-test:
    name: Ruff y pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias de desarrollo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formato)
        run: ruff format --check .

      - name: Pytest
        run: pytest

  airflow-dags:
    name: Integridad de los DAGs de Airflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: airflow/requirements.txt

      - name: Instalar Airflow (versiones fijas con constraints oficiales)
        run: |
          python -m pip install --upgrade pip
          pip install -r airflow/requirements.txt pytest pyyaml

      - name: Pytest de DAGs
        run: pytest airflow/tests

  terraform-validate:
    name: Terraform fmt y validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [infra/aws, infra/snowflake]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Formato
        working-directory: ${{ matrix.dir }}
        run: terraform fmt -check -recursive -diff

      - name: Init sin backend
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false -input=false -no-color

      - name: Validate
        working-directory: ${{ matrix.dir }}
        run: terraform validate -no-color

  terraform-plan:
    name: Terraform plan (infra/aws)
    needs: [lint-test, airflow-dags, terraform-validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Comprobar secrets de AWS
        id: gate
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          # Los secrets no llegan a PRs desde forks: ahí se omite el plan con un aviso.
          ES_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          if [ "$ES_FORK" = "true" ]; then
            echo "::notice::PR desde fork: no hay secrets de AWS; se omite terraform plan."
            echo "disponible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$ROLE_ARN" ] || [ -z "$TF_STATE_BUCKET" ]; then
            echo "::error::Faltan los secrets AWS_ROLE_ARN y/o TF_STATE_BUCKET (outputs GitHubActionsRoleArn y TfStateBucket del bootstrap)."
            exit 1
          fi
          echo "disponible=true" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v4
        if: steps.gate.outputs.disponible == 'true'
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6.3.0
        if: steps.gate.outputs.disponible == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Descargar configuración de infra/aws (S3)
        if: steps.gate.outputs.disponible == 'true'
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/lib.sh"
          config_pull

      - name: Init con backend S3
        if: steps.gate.outputs.disponible == 'true'
        working-directory: infra/aws
        run: |
          terraform init -input=false -no-color \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=aws/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"

      - name: Plan
        if: steps.gate.outputs.disponible == 'true'
        working-directory: infra/aws
        run: terraform plan -input=false -no-color -lock-timeout=5m -var-file=config.auto.tfvars
