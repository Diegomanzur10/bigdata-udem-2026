name: Debug OIDC

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-2

jobs:
  debug:
    name: Claims del token OIDC y caller identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Imprimir claims del token (sin el token)
        run: |
          set -euo pipefail
          TOKEN="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')"
          echo "::add-mask::${TOKEN}"

          payload="$(cut -d. -f2 <<< "$TOKEN" | tr '_-' '/+')"
          pad=$(( (4 - ${#payload} % 4) % 4 ))
          if (( pad > 0 )); then
            payload="${payload}$(printf '%*s' "$pad" '' | tr ' ' '=')"
          fi

          printf '%s' "$payload" | base64 -d | jq '{
            sub,
            repository,
            repository_id,
            repository_owner,
            repository_owner_id,
            ref,
            event_name,
            aud,
            iss
          }'

      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Caller identity
        run: aws sts get-caller-identity
