name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply:
        description: "true ejecuta terraform apply; false solo plan (la sincronización de código se hace igual)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  TERRAFORM_VERSION: "1.17.0"
  PREFIX: ${{ vars.PREFIX || 'bigdata' }}

jobs:
  deploy:
    name: Terraform + sincronizar código a S3
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_prefix: ${{ vars.PREFIX || 'bigdata' }}
      TF_VAR_aws_region: us-east-2
      # Correo de alertas: secret o variable ALERT_EMAIL del repo (obligatorio).
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL || vars.ALERT_EMAIL }}
      # Flags y fase 2 de Snowflake: variables del repo (Settings > Secrets and variables > Actions > Variables).
      TF_VAR_enable_glue: ${{ vars.ENABLE_GLUE || 'true' }}
      TF_VAR_enable_airflow: ${{ vars.ENABLE_AIRFLOW || 'false' }}
      TF_VAR_snowflake_iam_user_arn: ${{ vars.SNOWFLAKE_IAM_USER_ARN }}
      TF_VAR_snowflake_external_id: ${{ vars.SNOWFLAKE_EXTERNAL_ID }}
      # En push a main siempre se aplica; en dispatch depende del input.
      APPLY: ${{ github.event_name == 'push' || inputs.apply }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolver bucket del lake
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${TF_VAR_alert_email}" ]; then
            echo "::error::Falta ALERT_EMAIL. Créalo como secret o variable del repo (correo para las alertas de presupuesto)."
            exit 1
          fi
          if [ -z "${TF_STATE_BUCKET}" ]; then
            echo "::error::Falta el secret TF_STATE_BUCKET (output TfStateBucket del bootstrap)."
            exit 1
          fi
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "LAKE_BUCKET=${PREFIX}-lake-${ACCOUNT_ID}-${AWS_REGION}" >> "$GITHUB_ENV"
          echo "::notice::Modo apply: ${APPLY}"

      - name: Terraform init (infra/aws)
        working-directory: infra/aws
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          terraform init -input=false -no-color \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=aws/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"

      - name: Terraform plan (infra/aws)
        working-directory: infra/aws
        run: terraform plan -input=false -no-color -lock-timeout=5m -out="${RUNNER_TEMP}/tfplan"

      - name: Terraform apply (infra/aws)
        if: env.APPLY == 'true'
        working-directory: infra/aws
        run: terraform apply -input=false -no-color -lock-timeout=5m "${RUNNER_TEMP}/tfplan"

      - name: Verificar bucket del lake
        run: |
          set -euo pipefail
          if ! aws s3api head-bucket --bucket "$LAKE_BUCKET" 2>/dev/null; then
            echo "::error::El bucket ${LAKE_BUCKET} no existe. Ejecuta el deploy con apply=true primero."
            exit 1
          fi

      - name: Empaquetar src/pipeline
        run: |
          set -euo pipefail
          mkdir -p build
          rm -f build/pipeline.zip
          (cd src && zip -r -q ../build/pipeline.zip pipeline -x '*/__pycache__/*' '*.pyc')

      - name: Subir código, DAGs y framework a S3
        run: |
          set -euo pipefail
          aws s3 cp build/pipeline.zip "s3://${LAKE_BUCKET}/code/pipeline.zip"
          aws s3 cp src/pipeline/run_glue.py "s3://${LAKE_BUCKET}/code/run_glue.py"
          aws s3 sync airflow/dags "s3://${LAKE_BUCKET}/dags/" --delete --exclude '*__pycache__*'
          aws s3 sync airflow/framework "s3://${LAKE_BUCKET}/code/airflow/framework/" --delete --exclude '*__pycache__*'
          aws s3 cp airflow/docker-compose.yaml "s3://${LAKE_BUCKET}/code/airflow/docker-compose.yaml"
          echo "Código sincronizado en s3://${LAKE_BUCKET}/"
