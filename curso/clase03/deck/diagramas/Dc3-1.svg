<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Helvetica Neue, Arial, sans-serif">
<title>Tres problemas encadenados, cada uno con su síntoma medido</title>
<desc>Comparar filas sin perderlas, encadenar cálculos sin errores y guardar para que el total cuadre, con su síntoma medido, su idea y las slides donde se trabaja.</desc>
<defs><marker id="m_acento" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2340D8"/></marker><marker id="m_gris" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#5F6672"/></marker><marker id="m_ink" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#15171C"/></marker></defs>
<rect x="40" y="60" width="340" height="300" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="2"/>
<text x="58" y="130.4" font-size="26" fill="#15171C" font-weight="700">1 · Comparar filas sin</text>
<text x="58" y="162.9" font-size="26" fill="#15171C" font-weight="700">perderlas</text>
<text x="58" y="203.7" font-size="22" fill="#15171C">Síntoma: GROUP BY deja</text>
<text x="58" y="231.2" font-size="22" fill="#15171C">99 996 de 1 500 000 filas</text>
<text x="58" y="268.6" font-size="22" fill="#15171C">Idea: función de ventana</text>
<text x="58" y="308.2" font-size="20" fill="#5F6672">Slides 6-11 · Lab 3A</text>
<rect x="430" y="60" width="340" height="300" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="2"/>
<text x="448" y="103.0" font-size="26" fill="#15171C" font-weight="700">2 · Encadenar cálculos</text>
<text x="448" y="135.4" font-size="26" fill="#15171C" font-weight="700">sin errores</text>
<text x="448" y="176.2" font-size="22" fill="#15171C">Síntoma: un JOIN infla el</text>
<text x="448" y="203.7" font-size="22" fill="#15171C">total 5 veces; el promedio de</text>
<text x="448" y="231.2" font-size="22" fill="#15171C">promedios se desvía 6.9 %</text>
<text x="448" y="268.6" font-size="22" fill="#15171C">Idea: QUALIFY, CTE,</text>
<text x="448" y="296.1" font-size="22" fill="#15171C">agregar antes de unir</text>
<text x="448" y="335.8" font-size="20" fill="#5F6672">Slides 18-22 · Lab 3B</text>
<rect x="820" y="60" width="340" height="300" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="2"/>
<text x="838" y="116.7" font-size="26" fill="#15171C" font-weight="700">3 · Guardar para que el</text>
<text x="838" y="149.2" font-size="26" fill="#15171C" font-weight="700">total cuadre</text>
<text x="838" y="189.9" font-size="22" fill="#15171C">Síntoma: una pregunta por</text>
<text x="838" y="217.4" font-size="22" fill="#15171C">región pide 4 uniones</text>
<text x="838" y="254.9" font-size="22" fill="#15171C">Idea: modelo dimensional</text>
<text x="838" y="282.4" font-size="22" fill="#15171C">con grano</text>
<text x="838" y="322.0" font-size="20" fill="#5F6672">Slides 24-36 · Lab 3C</text>
<line x1="388" y1="210" x2="422" y2="210" stroke="#2340D8" stroke-width="3" marker-end="url(#m_acento)"/>
<line x1="778" y1="210" x2="812" y2="210" stroke="#2340D8" stroke-width="3" marker-end="url(#m_acento)"/>
<rect x="40" y="392" width="1120" height="64" rx="6" fill="#F0EEE7" stroke="#2340D8" stroke-width="3"/>
<text x="600.0" y="431.8" font-size="24" fill="#15171C" text-anchor="middle">Caso de cierre: ¿la lluvia cambia los viajes en NYC? (slide 37)</text>
</svg>
