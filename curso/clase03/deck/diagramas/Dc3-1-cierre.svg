<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Helvetica Neue, Arial, sans-serif">
<title>Qué quedó resuelto de los tres problemas y qué sigue en la clase 4</title>
<desc>Tres cajas con lo que la clase resolvió en cada problema y una franja con lo que sigue.</desc>
<defs><marker id="m_acento" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2340D8"/></marker><marker id="m_gris" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#5F6672"/></marker><marker id="m_ink" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#15171C"/></marker></defs>
<rect x="40" y="60" width="340" height="300" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="2"/>
<text x="58" y="134.4" font-size="26" fill="#15171C" font-weight="700">1 · Comparar filas sin</text>
<text x="58" y="166.9" font-size="26" fill="#15171C" font-weight="700">perderlas</text>
<text x="58" y="207.7" font-size="22" fill="#15171C" font-weight="700">Quedó:</text>
<text x="58" y="237.2" font-size="22" fill="#15171C">ventana: el detalle y el total</text>
<text x="58" y="264.6" font-size="22" fill="#15171C">en la misma fila</text>
<text x="58" y="304.2" font-size="20" fill="#5F6672">Slides 6-11 · Lab 3A</text>
<rect x="430" y="60" width="340" height="300" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="2"/>
<text x="448" y="107.0" font-size="26" fill="#15171C" font-weight="700">2 · Encadenar cálculos</text>
<text x="448" y="139.4" font-size="26" fill="#15171C" font-weight="700">sin errores</text>
<text x="448" y="180.2" font-size="22" fill="#15171C" font-weight="700">Quedó:</text>
<text x="448" y="209.7" font-size="22" fill="#15171C">filtrar sin anidar; pasos con</text>
<text x="448" y="237.2" font-size="22" fill="#15171C">nombre; agregar antes de</text>
<text x="448" y="264.6" font-size="22" fill="#15171C">unir (sin el 5×); promedio</text>
<text x="448" y="292.1" font-size="22" fill="#15171C">ponderado 151 219.54</text>
<text x="448" y="331.8" font-size="20" fill="#5F6672">Slides 18-22 · Lab 3B</text>
<rect x="820" y="60" width="340" height="300" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="2"/>
<text x="838" y="120.7" font-size="26" fill="#15171C" font-weight="700">3 · Guardar para que el</text>
<text x="838" y="153.2" font-size="26" fill="#15171C" font-weight="700">total cuadre</text>
<text x="838" y="193.9" font-size="22" fill="#15171C" font-weight="700">Quedó:</text>
<text x="838" y="223.4" font-size="22" fill="#15171C">de 4 uniones a 1; ejecución</text>
<text x="838" y="250.9" font-size="22" fill="#15171C">casi a la mitad en esta</text>
<text x="838" y="278.4" font-size="22" fill="#15171C">medición; 4 controles</text>
<text x="838" y="318.0" font-size="20" fill="#5F6672">Slides 24-36 · Lab 3C</text>
<line x1="388" y1="210" x2="422" y2="210" stroke="#2340D8" stroke-width="3" marker-end="url(#m_acento)"/>
<line x1="778" y1="210" x2="812" y2="210" stroke="#2340D8" stroke-width="3" marker-end="url(#m_acento)"/>
<rect x="40" y="384" width="1120" height="108" rx="6" fill="#F0EEE7" stroke="#2340D8" stroke-width="3"/>
<text x="600.0" y="426.8" font-size="24" fill="#15171C" text-anchor="middle">Clase 4: lake en S3 y carga a Snowflake de los 239.5 M de viajes de NYC (2024)</text>
<text x="600.0" y="464.8" font-size="24" fill="#15171C" font-weight="700" text-anchor="middle">¿La lluvia cambia los viajes? La responde el Taller 1, entrega 15 de noviembre.</text>
</svg>
